name: Secret keyboard verification APKs
on:
  push:
    branches: [build/android-secret-keyboard-apks]
permissions:
  contents: read
jobs:
  android:
    if: github.repository == 'fionn77/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: [base, fixed]
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      T3_NATIVE_CLIENT_CACHE: "off"
      T3_NATIVE_CLIENT_BUILD: local
      T3_NATIVE_CLIENT_VERBOSE: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Restore baseline keyboard behavior
        if: matrix.version == 'base'
        run: |
          file=apps/mobile/modules/t3-composer-editor/android/src/main/java/expo/modules/t3composereditor/T3ComposerEditorView.kt
          git show HEAD~2:"$file" > "$file"
          git diff -- "$file"
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/mobile... --filter=@t3tools/scripts...
          save-pnpm-store: "false"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Bound Gradle memory and parallelism
        run: |
          mkdir -p "$HOME/.gradle"
          printf 'org.gradle.jvmargs=-Xmx4096m\norg.gradle.daemon=false\norg.gradle.workers.max=2\n' > "$HOME/.gradle/gradle.properties"
      - name: Build development APK
        run: vp run mobile:install android --prepare --abi x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: t3-secret-keyboard-${{ matrix.version }}
          path: ~/.cache/t3code/native-clients/artifacts/android/development-x86_64/
          if-no-files-found: error
          retention-days: 7
